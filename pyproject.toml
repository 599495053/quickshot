[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickshot"
version = "5.3.2"
description = "Windows 截图工具，支持区域/窗口截图、标注、OCR、翻译、上传和贴图。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PyQt6>=6.11.0",
    "mss>=10.2.0",
    "dxcam[winrt]>=0.3.0",
    "numpy>=2.4.6",
    "Pillow>=12.2.0",
    "deep-translator>=1.11.4",
    "keyring>=25.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr_onnxruntime>=1.2.3",
]
dev = [
    "pytest>=8.0.0",
    "pyflakes>=3.2.0",
    "pyinstaller>=6.20.0",
]

[project.scripts]
quickshot = "quickshot.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["quickshot"]
